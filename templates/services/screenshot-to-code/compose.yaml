services:
  screenshot-backend:
    image: codex-harness-screenshot-backend:d026163
    container_name: codex-harness-screenshot-backend
    env_file: .env
    ports:
      - "127.0.0.1:${SCREENSHOT_BACKEND_PORT:-17001}:7001"
    volumes:
      - screenshot-logs:/app/run_logs
      - screenshot-assets:/app/local_assets
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    restart: unless-stopped
  screenshot-frontend:
    image: codex-harness-screenshot-frontend:d026163
    container_name: codex-harness-screenshot-frontend
    environment:
      PROXY_CODEGEN_BACKEND: http://screenshot-backend:7001
    ports:
      - "127.0.0.1:${SCREENSHOT_FRONTEND_PORT:-15173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    restart: unless-stopped
volumes:
  screenshot-logs:
    name: codex-harness-screenshot-logs
  screenshot-assets:
    name: codex-harness-screenshot-assets
