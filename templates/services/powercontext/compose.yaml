services:
  powercontext:
    image: ${HARNESS_POWERCONTEXT_IMAGE:?prepare managed service layout first}
    container_name: ${HARNESS_SERVICE_NAMESPACE:?}-powercontext
    env_file: .env
    ports:
      - "127.0.0.1:${POWERCONTEXT_PORT:-18080}:8000"
    volumes:
      - powercontext-data:/data
    restart: "no"
volumes:
  powercontext-data:
    name: ${HARNESS_VOLUME_NAMESPACE:?}-powercontext-data
    labels:
      com.harness.state_id: ${HARNESS_STATE_ID:?}
      com.harness.data_namespace: ${HARNESS_VOLUME_NAMESPACE:?}
